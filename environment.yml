name: breastsim
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib
  - h5py
  - aria2
  - pandas
  - openpyxl
  - scikit-image
  - pytest
  - httpx
  - ipykernel
  - pip
  - pip:
      - k-wave-python
      - fastapi
      - uvicorn[standard]
      - playwright          # e2e UI check (src/scripts/e2e_check.py)
# PyMUST is installed editable from lib/PyMUST, and PyTorch per platform,
# by src/scripts/setup_env.sh.
